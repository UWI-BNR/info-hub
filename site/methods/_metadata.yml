# Shared metadata for all Public Methods Manual pages
lang: en-GB
author: "Barbados National Registry"
date: last-modified
title-block-style: plain
published-title: "Updated"
date-format: "D MMMM YYYY"
toc: true
toc-title: "On this page"
toc-depth: 2
number-sections: false
page-navigation: true
search: true

# Manual review status is inherited by every page. Change the display switch
# here to remove the strip from the complete manual before public publication.
manual-review-status: not-reviewed
manual-review-display: true
filters:
  - ../_filters/manual-review-status.lua

format:
  html:
    # Reuse the compact manual metadata treatment while retaining a
    # Methods-specific class for any later refinements.
    body-classes: "bnr-technical-manual bnr-methods-manual"
