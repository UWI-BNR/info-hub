<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2100" height="3060" viewBox="0 0 2100 3060">
  <defs>
    <clipPath id="browserClip">
      <rect x="160" y="730" width="1780" height="1250" rx="28"/>
    </clipPath>
    <clipPath id="heroClip">
      <rect x="190" y="905" width="1720" height="350"/>
    </clipPath>
    <linearGradient id="heroShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#003c56" stop-opacity="0.80"/>
      <stop offset="1" stop-color="#003c56" stop-opacity="0.48"/>
    </linearGradient>
  </defs>

  <!-- A deliberately separate inside-back-cover design. -->
  <rect width="2100" height="3060" fill="#045174"/>
  <rect y="2140" width="2100" height="920" fill="#f5f7f8"/>
  <rect y="2130" width="2100" height="10" fill="#e7a04b"/>

  <text x="160" y="180" fill="#f1b25e"
        font-family="Montserrat, Arial, sans-serif" font-size="34" font-weight="700"
        letter-spacing="3">BARBADOS NATIONAL REGISTRY</text>
  <text x="160" y="310" fill="#ffffff"
        font-family="Montserrat, Arial, sans-serif" font-size="94" font-weight="700">
    Explore Barbados' cardiovascular
  </text>
  <text x="160" y="420" fill="#ffffff"
        font-family="Montserrat, Arial, sans-serif" font-size="94" font-weight="700">
    evidence
  </text>
  <text x="160" y="525" fill="#d9e9ef"
        font-family="Arial, sans-serif" font-size="40">
    Results, reports, methods and downloadable public data - together in one place.
  </text>

  <!-- Simplified browser view using the same visual language as the live Hub. -->
  <rect x="160" y="750" width="1780" height="1250" rx="28" fill="#002f45" opacity="0.36"/>
  <rect x="160" y="730" width="1780" height="1250" rx="28" fill="#ffffff"/>
  <g clip-path="url(#browserClip)">
    <rect x="160" y="730" width="1780" height="80" fill="#e9eef1"/>
    <circle cx="215" cy="770" r="12" fill="#cf6868"/>
    <circle cx="255" cy="770" r="12" fill="#e7a04b"/>
    <circle cx="295" cy="770" r="12" fill="#4b9470"/>
    <rect x="360" y="748" width="1300" height="44" rx="18" fill="#ffffff"/>
    <text x="400" y="779" fill="#637780" font-family="Arial, sans-serif" font-size="21">
      uwi-bnr.github.io/info-hub/
    </text>

    <!-- A restrained white inner mat keeps the dark website navigation
         visually separate from the dark promotional-page background. -->
    <rect x="180" y="810" width="1740" height="1170" fill="#ffffff"/>
    <rect x="190" y="820" width="1720" height="85" fill="#045174"/>
    <text x="235" y="875" fill="#ffffff" font-family="Montserrat, Arial, sans-serif"
          font-size="34" font-weight="600">BNR Hub</text>
    <text x="490" y="873" fill="#ffffff" font-family="Arial, sans-serif" font-size="23">Latest</text>
    <text x="630" y="873" fill="#ffffff" font-family="Arial, sans-serif" font-size="23">Surveillance</text>
    <text x="825" y="873" fill="#ffffff" font-family="Arial, sans-serif" font-size="23">Downloads</text>
    <text x="1000" y="873" fill="#ffffff" font-family="Arial, sans-serif" font-size="23">Methods</text>
    <text x="1140" y="873" fill="#ffffff" font-family="Arial, sans-serif" font-size="23">About</text>

    <image x="190" y="905" width="1720" height="350"
           preserveAspectRatio="xMidYMid slice"
           xlink:href="../../../../site/assets/images/bnr-hero1.jpg"
           clip-path="url(#heroClip)"/>
    <rect x="190" y="905" width="1720" height="350" fill="url(#heroShade)"/>
    <rect x="630" y="965" width="840" height="220" rx="16" fill="#003c56" opacity="0.80"/>
    <text x="1050" y="1035" text-anchor="middle" fill="#f1b25e"
          font-family="Montserrat, Arial, sans-serif" font-size="23" font-weight="700"
          letter-spacing="2">THE BARBADOS NATIONAL REGISTRY</text>
    <text x="1050" y="1135" text-anchor="middle" fill="#ffffff"
          font-family="Montserrat, Arial, sans-serif" font-size="67" font-weight="500">Data for Impact</text>

    <rect x="190" y="1255" width="1720" height="725" fill="#ffffff"/>
    <text x="1050" y="1350" text-anchor="middle" fill="#263e49"
          font-family="Montserrat, Arial, sans-serif" font-size="38" font-weight="500">
      Clear evidence on cardiovascular health in Barbados
    </text>
    <text x="1050" y="1410" text-anchor="middle" fill="#526770"
          font-family="Arial, sans-serif" font-size="27">
      Data, methods and public reporting to support prevention, planning and accountability.
    </text>

    <g>
      <rect x="270" y="1495" width="480" height="340" rx="8" fill="#ffffff" stroke="#c7d0d4" stroke-width="2"/>
      <rect x="270" y="1495" width="480" height="10" fill="#045174"/>
      <text x="310" y="1580" fill="#045174" font-family="Montserrat, Arial, sans-serif" font-size="31" font-weight="700">CVD events</text>
      <text x="310" y="1640" fill="#354e59" font-family="Arial, sans-serif" font-size="25">Track heart attacks and strokes</text>
      <text x="310" y="1680" fill="#354e59" font-family="Arial, sans-serif" font-size="25">over time.</text>
      <rect x="310" y="1740" width="245" height="56" rx="5" fill="#045174"/>
      <text x="432" y="1777" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="23">Explore events</text>

      <rect x="810" y="1495" width="480" height="340" rx="8" fill="#ffffff" stroke="#c7d0d4" stroke-width="2"/>
      <rect x="810" y="1495" width="480" height="10" fill="#045174"/>
      <text x="850" y="1580" fill="#045174" font-family="Montserrat, Arial, sans-serif" font-size="31" font-weight="700">CVD deaths</text>
      <text x="850" y="1640" fill="#354e59" font-family="Arial, sans-serif" font-size="25">Explore cardiovascular mortality</text>
      <text x="850" y="1680" fill="#354e59" font-family="Arial, sans-serif" font-size="25">patterns and uncertainty.</text>
      <rect x="850" y="1740" width="245" height="56" rx="5" fill="#045174"/>
      <text x="972" y="1777" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="23">Explore deaths</text>

      <rect x="1350" y="1495" width="480" height="340" rx="8" fill="#ffffff" stroke="#c7d0d4" stroke-width="2"/>
      <rect x="1350" y="1495" width="480" height="10" fill="#045174"/>
      <text x="1390" y="1580" fill="#045174" font-family="Montserrat, Arial, sans-serif" font-size="31" font-weight="700">Reports and updates</text>
      <text x="1390" y="1640" fill="#354e59" font-family="Arial, sans-serif" font-size="25">Read the latest approved BNR</text>
      <text x="1390" y="1680" fill="#354e59" font-family="Arial, sans-serif" font-size="25">publications.</text>
      <rect x="1390" y="1740" width="250" height="56" rx="5" fill="#045174"/>
      <text x="1515" y="1777" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="23">View reports</text>
    </g>
  </g>

  <text x="160" y="2300" fill="#203a46"
        font-family="Montserrat, Arial, sans-serif" font-size="58" font-weight="700">
    Evidence you can find, understand and trust
  </text>
  <text x="160" y="2380" fill="#50666f" font-family="Arial, sans-serif" font-size="32">
    View the latest evidence  |  Download public data  |  Read the methods
  </text>

  <rect x="155" y="2490" width="420" height="420" rx="12" fill="#ffffff" stroke="#d5dde0" stroke-width="2"/>
  <!-- 370 px is exactly 10 pixels for each module in the 37-module QR. -->
  <image x="180" y="2515" width="370" height="370" xlink:href="bnr_info_hub_qr.svg"
         image-rendering="pixelated"/>

  <text x="635" y="2600" fill="#045174"
        font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="700"
        letter-spacing="1">VISIT THE BNR INFORMATION HUB</text>
  <text x="635" y="2700" fill="#203a46"
        font-family="Montserrat, Arial, sans-serif" font-size="47" font-weight="700">
    uwi-bnr.github.io/info-hub/
  </text>
  <text x="635" y="2790" fill="#50666f" font-family="Arial, sans-serif" font-size="29">
    Scan the code or use the address to open the Hub.
  </text>

  <line x1="160" y1="2945" x2="1940" y2="2945" stroke="#b7c8cf" stroke-width="2"/>
  <text x="160" y="2998" fill="#6c7e86" font-family="Arial, sans-serif" font-size="23">
    Barbados National Registry | The University of the West Indies, Cave Hill Campus
  </text>
</svg>
