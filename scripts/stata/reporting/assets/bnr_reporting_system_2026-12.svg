<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="900" viewBox="0 0 1536 900">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6f8799"/></marker></defs>
  <rect width="1536" height="900" fill="#ffffff"/><rect x="20" y="20" width="1496" height="860" rx="16" fill="#ffffff" stroke="#9db0c3" stroke-width="1.5"/>
  <style>.title{font:700 31px 'Montserrat',Arial,sans-serif;fill:#0b284c}.subtitle{font:italic 18px 'Montserrat',Arial,sans-serif;fill:#38536d}.num{font:700 18px 'Montserrat',Arial,sans-serif;fill:#fff}.head{font:700 18px 'Montserrat',Arial,sans-serif;fill:#0b284c}.box{font:700 16px 'Montserrat',Arial,sans-serif;fill:#172d4d}.small{font:14px 'Montserrat',Arial,sans-serif;fill:#516579}</style>
  <text x="48" y="67" class="title">BNR REPORTING SYSTEM — FOUR CONNECTED AREAS</text><text x="48" y="96" class="subtitle">A controlled route from source data to transparent public reporting</text><line x1="48" y1="118" x2="1488" y2="118" stroke="#d5a520" stroke-width="2"/>
  <g stroke="#6f8799" stroke-width="2" marker-end="url(#arrow)"><line x1="374" y1="174" x2="397" y2="174"/><line x1="746" y1="174" x2="769" y2="174"/><line x1="1118" y1="174" x2="1141" y2="174"/></g>
  <g><rect x="48" y="140" width="326" height="616" rx="14" fill="#f0f6f8" stroke="#7fa3b2"/><circle cx="83" cy="174" r="22" fill="#075174"/><text x="83" y="181" text-anchor="middle" class="num">1</text><text x="116" y="168" class="head">DATA FOUNDATION</text><text x="116" y="191" class="small">Reliable inputs with known identity</text><rect x="70" y="230" width="282" height="84" rx="10" fill="#fff" stroke="#c4d7df"/><text x="91" y="265" class="box">Case capture</text><text x="91" y="288" class="small">Structured clinical records</text><rect x="70" y="330" width="282" height="84" rx="10" fill="#fff" stroke="#c4d7df"/><text x="91" y="365" class="box">REDCap data management</text><text x="91" y="388" class="small">Managed registry data</text><rect x="70" y="430" width="282" height="84" rx="10" fill="#fff" stroke="#c4d7df"/><text x="91" y="465" class="box">Monthly data releases</text><text x="91" y="488" class="small">Named inputs for reporting</text><rect x="70" y="530" width="282" height="102" rx="10" fill="#fff" stroke="#c4d7df"/><text x="91" y="566" class="box">Maintained historical record</text><text x="91" y="589" class="small">Traceable cumulative foundation</text><text x="91" y="610" class="small">and approved source releases</text></g>
  <g><rect x="420" y="140" width="326" height="616" rx="14" fill="#f6f3f9" stroke="#aa94bb"/><circle cx="455" cy="174" r="22" fill="#6e4b8f"/><text x="455" y="181" text-anchor="middle" class="num">2</text><text x="488" y="168" class="head">DEFINITIONS &amp; METHODS</text><text x="488" y="191" class="small">Common rules across products</text><rect x="442" y="230" width="282" height="84" rx="10" fill="#fff" stroke="#d8cbe1"/><text x="463" y="265" class="box">Event identification</text><text x="463" y="288" class="small">CVD, heart and stroke</text><rect x="442" y="330" width="282" height="84" rx="10" fill="#fff" stroke="#d8cbe1"/><text x="463" y="365" class="box">Mortality identification</text><text x="463" y="388" class="small">Primary and Inclusive estimates</text><rect x="442" y="430" width="282" height="84" rx="10" fill="#fff" stroke="#d8cbe1"/><text x="463" y="465" class="box">DCO identification &amp; linkage</text><text x="463" y="488" class="small">National event estimation</text><rect x="442" y="530" width="282" height="102" rx="10" fill="#fff" stroke="#d8cbe1"/><text x="463" y="566" class="box">Metrics and uncertainty</text><text x="463" y="589" class="small">Consistent calculation, confidence</text><text x="463" y="610" class="small">limits and interpretation</text></g>
  <g><rect x="792" y="140" width="326" height="616" rx="14" fill="#f8f6ed" stroke="#c8b578"/><circle cx="827" cy="174" r="22" fill="#916f00"/><text x="827" y="181" text-anchor="middle" class="num">3</text><text x="860" y="168" class="head">ASSURANCE &amp; GOVERNANCE</text><text x="860" y="191" class="small">Controls before publication</text><rect x="814" y="230" width="282" height="84" rx="10" fill="#fff" stroke="#ddd2ad"/><text x="835" y="265" class="box">Automated validation</text><text x="835" y="288" class="small">Repeatable quality checks</text><rect x="814" y="330" width="282" height="84" rx="10" fill="#fff" stroke="#ddd2ad"/><text x="835" y="365" class="box">Human review and approval</text><text x="835" y="388" class="small">Explicit release decisions</text><rect x="814" y="430" width="282" height="84" rx="10" fill="#fff" stroke="#ddd2ad"/><text x="835" y="465" class="box">Disclosure control</text><text x="835" y="488" class="small">Protection across whole outputs</text><rect x="814" y="530" width="282" height="102" rx="10" fill="#fff" stroke="#ddd2ad"/><text x="835" y="566" class="box">Versioned publication</text><text x="835" y="589" class="small">Candidate, approval and controlled</text><text x="835" y="610" class="small">promotion to public release</text></g>
  <g><rect x="1164" y="140" width="324" height="616" rx="14" fill="#eef7f3" stroke="#8bb7a4"/><circle cx="1199" cy="174" r="22" fill="#2f7e60"/><text x="1199" y="181" text-anchor="middle" class="num">4</text><text x="1232" y="168" class="head">PUBLIC REPORTING</text><text x="1232" y="191" class="small">Different products, one meaning</text><rect x="1186" y="230" width="280" height="84" rx="10" fill="#fff" stroke="#c3dbd1"/><text x="1207" y="265" class="box">Dashboards and updates</text><text x="1207" y="288" class="small">Linked tables and monthly outputs</text><rect x="1186" y="330" width="280" height="84" rx="10" fill="#fff" stroke="#c3dbd1"/><text x="1207" y="365" class="box">Annual reports</text><text x="1207" y="388" class="small">Controlled national summaries</text><rect x="1186" y="430" width="280" height="84" rx="10" fill="#fff" stroke="#c3dbd1"/><text x="1207" y="465" class="box">One-off reports</text><text x="1207" y="488" class="small">Approved standalone analyses</text><rect x="1186" y="530" width="280" height="102" rx="10" fill="#fff" stroke="#c3dbd1"/><text x="1207" y="566" class="box">Transparent methods</text><text x="1207" y="589" class="small">Definitions and limitations in</text><text x="1207" y="610" class="small">the online manuals</text></g>
  <rect x="156" y="790" width="1224" height="54" rx="27" fill="#0b284c"/><text x="768" y="824" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">Published through the BNR Information Hub</text>
</svg>
